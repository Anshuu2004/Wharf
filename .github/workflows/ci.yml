name: Wharf CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Wharf_/backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npx eslint "src/**/*.ts" "tests/**/*.ts" --if-present || true

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests & Coverage
        run: npm run test:cov

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Wharf_/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npm run lint --if-present || true

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests & Coverage
        run: npm run test:cov
